<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>หุ่นยนต์หาดาว · Bright Up Kids</title>
<style>
:root{--bg:#fff8e7;--ink:#3b2f1e;--card:#fff;--line:#f0dcae;--amber:#f59e0b;--green:#22a06b;--red:#e5484d;--blue:#3b82f6;--orange:#f97316;--purple:#8b5cf6;--grey:#e8e1d0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans Thai","Sarabun",Tahoma,system-ui,sans-serif;font-size:18px}
button{font:inherit;color:inherit;cursor:pointer;border:0;border-radius:16px;min-height:64px;padding:8px 14px;background:var(--card);box-shadow:0 3px 0 var(--line);touch-action:manipulation}
button:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
button:disabled{opacity:.45}
[hidden]{display:none!important}
.wrap{max-width:520px;margin:0 auto;padding:12px 14px 40px}
header{display:flex;align-items:center;gap:8px;margin-bottom:8px}
header h1{flex:1;margin:0;font-size:20px;line-height:1.2}
.small{min-height:48px;padding:4px 12px;font-size:16px}
h2{font-size:19px;margin:20px 0 8px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:10px}
.tile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:78px;font-weight:700;font-size:22px}
.tile small{font-weight:400;font-size:14px;letter-spacing:1px;color:#c98a00}
.tile.fix{background:#ffeef0}.tile.loop{background:#eef6ff}.tile.mk{background:#eefaf3}
#board{position:relative;margin:8px auto;border:4px solid #d9b45f;border-radius:14px;background:#fff;display:grid;overflow:hidden;touch-action:manipulation}
.cell{border:1px solid #f3e8c8;display:flex;align-items:center;justify-content:center;font-size:var(--fs,32px);user-select:none}
.cell.wall{background:#e9d9b5}.cell.start{background:#fff6d9}
#robot{position:absolute;display:flex;align-items:center;justify-content:center;font-size:var(--fs,32px);transition:left .35s ease,top .35s ease;pointer-events:none}
#robot.bump{animation:bump .4s}
@keyframes bump{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
#msg{min-height:56px;text-align:center;font-weight:700;font-size:20px;margin:6px 0;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:8px}
#msg.good{color:var(--green)}#msg.bad{color:var(--red)}
#prog{min-height:84px;background:#fff;border:3px dashed var(--line);border-radius:14px;padding:8px;display:flex;flex-wrap:wrap;gap:6px;align-content:flex-start}
#prog .hint{color:#b8a67a;font-size:16px;align-self:center;margin:auto}
.pc{width:56px;height:56px;min-height:56px;padding:0;font-size:30px;font-weight:700;color:#fff;box-shadow:0 3px 0 rgba(0,0,0,.18)}
.pc.U,.pad .U{background:var(--blue)}.pc.D,.pad .D{background:var(--orange)}.pc.L,.pad .L{background:var(--purple)}.pc.R,.pad .R{background:var(--green)}
.pc.sel,.loopbox.sel{outline:4px solid #111;outline-offset:2px}
.pc.run,.loopbox .run{outline:4px solid #f5c400;outline-offset:2px}
.pc.err{background:var(--red)!important;animation:bump .4s}
.loopbox{display:flex;flex-wrap:wrap;gap:6px;align-items:center;background:#e6f0ff;border:3px solid #9cc0ff;border-radius:14px;padding:6px}
.loopbox .head{display:flex;align-items:center;gap:6px;width:100%}
.loopbox .nbtn{min-height:48px;min-width:64px;font-weight:700;font-size:22px;background:#fff}
.loopbox .empty{color:#6b86b8;font-size:15px;padding:0 6px}
.pad{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.pad button{min-height:72px;font-size:34px;font-weight:700;color:#fff}
.pad .wide{grid-column:span 2;font-size:20px;color:var(--ink)}
.pad .go{grid-column:span 4;background:var(--green);color:#fff;font-size:26px;min-height:76px}
.pad .loopb{background:#4f7cff;font-size:17px;padding:4px}
.pad .tool{color:var(--ink);font-size:24px;background:#fff}
.pad .tool.on{outline:4px solid #111}
.pad .endb{background:#fff;color:var(--ink);font-size:20px}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.note{font-size:15px;color:#8a7a55;margin-top:18px;line-height:1.5}
a.note{color:#8a7a55}
</style>
</head>
<body>
<div class="wrap">

<section id="menu">
  <header><h1>🤖 หุ่นยนต์หาดาว</h1><button class="small" id="mute" aria-label="เสียง">🔊</button></header>
  <p style="margin:0 0 4px">สั่งหุ่นยนต์ด้วยลูกศร ให้เดินไปถึงดาว ⭐</p>
  <div id="menuBody"></div>
  <p class="note">Bright Up Kids · คอร์ส A1 คิดเป็นขั้นตอน · ไม่เก็บข้อมูลส่วนตัว ความคืบหน้าอยู่ในเครื่องนี้เท่านั้น<br>
  <a class="note" href="#" id="reset">ลบความคืบหน้าในเครื่องนี้</a></p>
</section>

<section id="game" hidden>
  <header><button class="small" id="back">⬅ เมนู</button><h1 id="gtitle"></h1><span id="gstars"></span></header>
  <div id="board"><div id="robot">🤖</div></div>
  <div id="msg"></div>
  <div id="prog"></div>
  <div class="pad" id="pad">
    <button class="U" data-d="U" aria-label="ขึ้น">↑</button>
    <button class="D" data-d="D" aria-label="ลง">↓</button>
    <button class="L" data-d="L" aria-label="ซ้าย">←</button>
    <button class="R" data-d="R" aria-label="ขวา">→</button>
    <button class="loopb" id="addLoop">🔁 ทำซ้ำ</button>
    <button class="endb" id="endLoop">จบกล่อง ✅</button>
    <button class="wide tool" id="del">🗑 ลบ</button>
    <button class="go" id="run">▶ เริ่ม!</button>
    <button class="wide tool" id="retry">↺ ให้หุ่นยนต์กลับจุดเริ่ม</button>
    <button class="wide tool" id="clear">🧹 ล้างทั้งหมด</button>
  </div>
</section>

<section id="maker" hidden>
  <header><button class="small" id="mback">⬅ เมนู</button><h1>✏️ สร้างเขาวงกต</h1></header>
  <p style="margin:0">เลือกเครื่องมือ แล้วแตะช่องในตาราง</p>
  <div id="mboard" style="position:relative;margin:8px auto;border:4px solid #d9b45f;border-radius:14px;background:#fff;display:grid;overflow:hidden"></div>
  <div id="mmsg" style="min-height:48px;text-align:center;font-weight:700"></div>
  <div class="pad" id="mpad">
    <button class="tool on" data-tool="S">🤖 จุดเริ่ม</button>
    <button class="tool" data-tool="*">⭐ ดาว</button>
    <button class="tool" data-tool="X">🧱 กำแพง</button>
    <button class="tool" data-tool=".">🧹 ลบ</button>
    <button class="go" id="mplay">▶ ลองเล่นด่านของฉัน</button>
  </div>
</section>

</div>
<script>
(function () {
  "use strict";
  var DIRS = { U: [-1, 0, "↑"], D: [1, 0, "↓"], L: [0, -1, "←"], R: [0, 1, "→"] };
  var M = function (d) { return { t: "m", d: d }; };
  var Rp = function (n) { return { t: "r", n: n, b: Array.prototype.slice.call(arguments, 1) }; };
  var OPEN5 = ["S....", ".....", ".....", ".....", "....*"];

  var LEVELS = [
    { id: 1, sec: "A", rows: [".....", ".....", ".....", ".....", "S..*."], sol: [M("R"), M("R"), M("R")] },
    { id: 2, sec: "A", rows: [".....", "*....", ".....", ".....", "S...."], sol: [M("U"), M("U"), M("U")] },
    { id: 3, sec: "A", rows: [".....", "...*.", ".....", ".....", "S...."], sol: [M("U"), M("U"), M("U"), M("R"), M("R"), M("R")] },
    { id: 4, sec: "A", rows: OPEN5, sol: [M("D"), M("D"), M("D"), M("D"), M("R"), M("R"), M("R"), M("R")] },
    { id: 5, sec: "A", rows: ["S.#..", "..#..", "..#..", ".....", "....*"], sol: [M("D"), M("D"), M("D"), M("R"), M("R"), M("R"), M("R"), M("D")] },
    { id: 6, sec: "A", rows: ["S....", ".###.", ".....", ".#.#.", "...*."], sol: [M("D"), M("D"), M("D"), M("D"), M("R"), M("R"), M("R")] },
    { id: 7, sec: "A", rows: ["S.#..", "#.#.#", "..#.#", ".##.#", "...*#"], sol: [M("R"), M("D"), M("D"), M("L"), M("D"), M("D"), M("R"), M("R"), M("R")] },

    { id: 8, sec: "B", fix: true, rows: [".....", "...*.", ".....", ".....", "S...."],
      preset: [M("U"), M("U"), M("R"), M("R"), M("R")], sol: [M("U"), M("U"), M("U"), M("R"), M("R"), M("R")],
      tip: "โปรแกรมนี้มีบั๊ก 🐞 เลือกการ์ด แล้วเติมหรือลบให้ถึงดาว" },
    { id: 9, sec: "B", fix: true, rows: ["S....", ".....", ".....", "...*.", "....."],
      preset: [M("R"), M("R"), M("R"), M("D"), M("D"), M("L")], sol: [M("R"), M("R"), M("R"), M("D"), M("D"), M("D")],
      tip: "การ์ดใบสุดท้ายผิดทิศ ลบแล้วใส่ใหม่" },
    { id: 10, sec: "B", fix: true, rows: ["S.#..", "..#..", ".....", "..#..", "..#.*"],
      preset: [M("D"), M("R"), M("R"), M("R"), M("R"), M("D"), M("D")], sol: [M("D"), M("D"), M("R"), M("R"), M("R"), M("R"), M("D"), M("D")],
      tip: "หุ่นยนต์ชนกำแพง แตะการ์ดแล้วเติมการ์ดตรงกลางได้" },

    { id: 11, sec: "C", loops: true, cap: 4, rows: ["........", "S......*", "........"], sol: [Rp(7, M("R"))],
      tip: "ใช้การ์ด 🔁 ทำซ้ำ แล้วใส่ → ข้างในกล่อง" },
    { id: 12, sec: "C", loops: true, cap: 5, rows: OPEN5, sol: [Rp(4, M("R"), M("D"))],
      tip: "เดินเป็นบันไดไปมุมขวาล่าง ทำซ้ำ [→ ↓]" },
    { id: 13, sec: "C", loops: true, cap: 5, rows: ["S......", ".......", ".......", ".......", "......*"], sol: [Rp(4, M("D")), Rp(6, M("R"))],
      tip: "ใช้กล่องทำซ้ำ 2 กล่อง" },
    { id: 14, sec: "C", fix: true, loops: true, rows: OPEN5, preset: [Rp(3, M("R"), M("D"))], sol: [Rp(4, M("R"), M("D"))],
      tip: "แตะเลขข้างกล่อง 🔁 เพื่อเปลี่ยนจำนวนรอบ" },
    { id: 15, sec: "C", fix: true, loops: true, rows: OPEN5, preset: [Rp(4, M("D")), Rp(3, M("R"))], sol: [Rp(4, M("D")), Rp(4, M("R"))],
      tip: "กล่องไหนทำซ้ำน้อยเกินไป" }
  ];
  var SECS = {
    A: { title: "⭐ ไปหาดาว", cls: "" },
    B: { title: "🐞 ล่าบั๊ก", cls: "fix" },
    C: { title: "🔁 ทำซ้ำ", cls: "loop" }
  };

  // ---------- pure logic ----------
  function parse(rows) {
    var g = { R: rows.length, C: rows[0].length, wall: [], s: null, star: null };
    rows.forEach(function (row, r) {
      g.wall.push([]);
      for (var c = 0; c < row.length; c++) {
        var ch = row[c];
        g.wall[r].push(ch === "#" || ch === "X");
        if (ch === "S") g.s = [r, c];
        if (ch === "*") g.star = [r, c];
      }
    });
    return g;
  }
  function clone(p) { return JSON.parse(JSON.stringify(p)); }
  function count(p) { return p.reduce(function (a, it) { return a + 1 + (it.t === "r" ? count(it.b) : 0); }, 0); }
  function flatten(p) {
    var out = [];
    p.forEach(function (it, i) {
      if (it.t === "m") out.push({ d: it.d, path: [i] });
      else for (var k = 0; k < it.n; k++) it.b.forEach(function (x, j) { out.push({ d: x.d, path: [i, j] }); });
    });
    return out.slice(0, 300);
  }
  function simulate(g, prog) {
    var steps = flatten(prog), pos = g.s.slice(), trail = [];
    for (var i = 0; i < steps.length; i++) {
      var v = DIRS[steps[i].d], nr = pos[0] + v[0], nc = pos[1] + v[1];
      if (nr < 0 || nc < 0 || nr >= g.R || nc >= g.C) return { ok: false, reason: "out", at: i, steps: steps, trail: trail, pos: pos };
      if (g.wall[nr][nc]) return { ok: false, reason: "wall", at: i, steps: steps, trail: trail, pos: pos };
      pos = [nr, nc]; trail.push(pos);
      if (pos[0] === g.star[0] && pos[1] === g.star[1]) return { ok: true, steps: steps.slice(0, i + 1), trail: trail, pos: pos };
    }
    return { ok: false, reason: "short", steps: steps, trail: trail, pos: pos };
  }
  function shortest(g) {
    var seen = {}, q = [[g.s[0], g.s[1], 0]];
    seen[g.s.join()] = 1;
    while (q.length) {
      var cur = q.shift();
      if (cur[0] === g.star[0] && cur[1] === g.star[1]) return cur[2];
      for (var k in DIRS) {
        var nr = cur[0] + DIRS[k][0], nc = cur[1] + DIRS[k][1];
        if (nr < 0 || nc < 0 || nr >= g.R || nc >= g.C || g.wall[nr][nc] || seen[nr + "," + nc]) continue;
        seen[nr + "," + nc] = 1; q.push([nr, nc, cur[2] + 1]);
      }
    }
    return -1;
  }
  function starsFor(cards, par) { return cards <= par ? 3 : cards <= par + 2 ? 2 : 1; }
  LEVELS.forEach(function (l) { l.par = count(l.sol); });

  window.__selfTest = function () {
    return LEVELS.map(function (l) {
      var g = parse(l.rows), s = simulate(g, l.sol);
      var pre = l.preset ? simulate(g, l.preset) : null;
      return { id: l.id, solOk: s.ok, par: l.par, presetFails: pre ? !pre.ok : null, capOk: l.cap ? l.par <= l.cap : true };
    });
  };

  // ---------- storage / sound ----------
  var progress = {}, muted = false, actx = null;
  try { progress = JSON.parse(localStorage.getItem("bu_a1_progress") || "{}") || {}; } catch (e) { progress = {}; }
  try { muted = localStorage.getItem("bu_a1_mute") === "1"; } catch (e) {}
  function save() { try { localStorage.setItem("bu_a1_progress", JSON.stringify(progress)); } catch (e) {} }
  function beep(f, d, type) {
    if (muted) return;
    try {
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      var o = actx.createOscillator(), gn = actx.createGain();
      o.type = type || "sine"; o.frequency.value = f; gn.gain.value = 0.06;
      o.connect(gn); gn.connect(actx.destination); o.start(); o.stop(actx.currentTime + d);
    } catch (e) {}
  }

  // ---------- dom helpers ----------
  var $ = function (id) { return document.getElementById(id); };
  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function show(id) { ["menu", "game", "maker"].forEach(function (s) { $(s).hidden = s !== id; }); window.scrollTo(0, 0); }
  function starStr(n) { return "★★★".slice(0, n) + "☆☆☆".slice(0, 3 - n); }

  // ---------- menu ----------
  function renderMenu() {
    var body = $("menuBody"); body.textContent = "";
    ["A", "B", "C"].forEach(function (sec) {
      body.appendChild(el("h2", null, SECS[sec].title));
      var t = el("div", "tiles");
      LEVELS.filter(function (l) { return l.sec === sec; }).forEach(function (l) {
        var b = el("button", "tile " + SECS[sec].cls);
        b.appendChild(el("span", null, String(l.id)));
        b.appendChild(el("small", null, starStr(progress[l.id] || 0)));
        b.onclick = function () { openLevel(l); };
        t.appendChild(b);
      });
      body.appendChild(t);
    });
    body.appendChild(el("h2", null, "✏️ สร้างเอง"));
    var t2 = el("div", "tiles");
    var mb = el("button", "tile mk", "สร้างเขาวงกต");
    mb.style.gridColumn = "span 2"; mb.style.fontSize = "20px";
    mb.onclick = openMaker; t2.appendChild(mb);
    body.appendChild(t2);
  }

  // ---------- game ----------
  var G = null; // {level, g, prog, sel, running, cap, timer}
  function openLevel(l, custom) {
    G = { level: l, g: parse(l.rows), prog: l.preset ? clone(l.preset) : [], sel: null, running: false, custom: !!custom };
    $("gtitle").textContent = custom ? (l.mine ? "ด่านของฉัน" : "เขาวงกตของเพื่อน") : "ด่าน " + l.id;
    $("gstars").textContent = custom ? "" : starStr(progress[l.id] || 0);
    $("addLoop").hidden = !(l.loops);
    buildBoard($("board"), G.g, "robot");
    placeRobot(G.g.s, true);
    setMsg(l.tip || (l.fix ? "โปรแกรมนี้มีบั๊ก 🐞" : "สั่งหุ่นยนต์ให้ไปถึงดาว"), "");
    renderProg(); show("game");
  }
  function buildBoard(b, g, withRobot) {
    var robot = withRobot ? $("robot") : null;
    b.textContent = ""; if (robot) b.appendChild(robot);
    var w = Math.min(window.innerWidth - 36, 420), cell = Math.floor(w / g.C);
    cell = Math.min(cell, 72);
    b.style.width = cell * g.C + 8 + "px";
    b.style.gridTemplateColumns = "repeat(" + g.C + "," + cell + "px)";
    b.style.setProperty("--fs", Math.round(cell * 0.62) + "px");
    b._cell = cell;
    for (var r = 0; r < g.R; r++) for (var c = 0; c < g.C; c++) {
      var d = el("div", "cell" + (g.wall[r][c] ? " wall" : "")); d.style.height = cell + "px";
      d.dataset.r = r; d.dataset.c = c;
      if (g.wall[r][c]) d.textContent = "🧱";
      else if (g.star && g.star[0] === r && g.star[1] === c) d.textContent = "⭐";
      else if (g.s && g.s[0] === r && g.s[1] === c) { d.className += " start"; d.textContent = "🏁"; }
      b.appendChild(d);
    }
    if (robot) { robot.style.width = cell + "px"; robot.style.height = cell + "px"; }
  }
  function placeRobot(pos, instant) {
    var rb = $("robot"), cell = $("board")._cell;
    if (instant) rb.style.transition = "none";
    rb.style.left = pos[1] * cell + "px"; rb.style.top = pos[0] * cell + "px";
    if (instant) { void rb.offsetWidth; rb.style.transition = ""; }
  }
  function setMsg(text, cls, extra) {
    var m = $("msg"); m.textContent = ""; m.className = cls || "";
    m.appendChild(el("span", null, text));
    if (extra) extra.forEach(function (b) { m.appendChild(b); });
  }

  // program model
  function getAt(path) { var it = G.prog[path[0]]; return path.length > 1 ? it.b[path[1]] : it; }
  function containerOf(path) { return path.length > 1 ? G.prog[path[0]].b : G.prog; }
  function capFull() { return G.level.cap && count(G.prog) >= G.level.cap; }
  function addMove(d) {
    if (G.running) return;
    if (capFull()) { setMsg("การ์ดเต็มแล้ว ลองใช้ 🔁 ทำซ้ำ", "bad"); return; }
    var card = M(d);
    if (!G.sel) { G.prog.push(card); G.sel = null; }
    else {
      var it = getAt(G.sel);
      if (it.t === "r") { it.b.push(card); G.sel = [G.sel[0], it.b.length - 1]; }
      else { var arr = containerOf(G.sel), i = G.sel[G.sel.length - 1]; arr.splice(i + 1, 0, card); G.sel = G.sel.slice(0, -1).concat(i + 1); }
    }
    beep(520, 0.07); setMsg("", ""); renderProg();
  }
  function addLoop() {
    if (G.running) return;
    if (G.sel && G.sel.length > 1) { setMsg("กล่องซ้อนกล่องยังไม่ได้ ลองกด จบกล่อง ✅ ก่อน", "bad"); return; }
    if (capFull()) { setMsg("การ์ดเต็มแล้ว", "bad"); return; }
    var box = Rp(2);
    if (!G.sel) { G.prog.push(box); G.sel = [G.prog.length - 1]; }
    else { var i = G.sel[0]; G.prog.splice(i + 1, 0, box); G.sel = [i + 1]; }
    beep(440, 0.07); setMsg("ใส่การ์ดลงในกล่อง 🔁", ""); renderProg();
  }
  function del() {
    if (G.running) return;
    if (G.sel) {
      var arr = containerOf(G.sel), i = G.sel[G.sel.length - 1];
      arr.splice(i, 1);
      if (G.sel.length > 1) G.sel = i > 0 ? [G.sel[0], i - 1] : [G.sel[0]];
      else G.sel = i > 0 ? [i - 1] : null;
    } else if (G.prog.length) {
      var last = G.prog[G.prog.length - 1];
      if (last.t === "r" && last.b.length) last.b.pop(); else G.prog.pop();
    }
    beep(300, 0.07); renderProg();
  }
  function renderProg() {
    var p = $("prog"); p.textContent = "";
    $("endLoop").hidden = !(G.sel && (G.sel.length > 1 || getAt(G.sel).t === "r"));
    if (!G.prog.length) p.appendChild(el("span", "hint", "แตะลูกศรด้านล่างเพื่อใส่การ์ด"));
    G.prog.forEach(function (it, i) {
      if (it.t === "m") p.appendChild(card(it, [i]));
      else p.appendChild(loopBox(it, i));
    });
  }
  function samePath(a, b) { return a && b && a.length === b.length && a.every(function (x, k) { return x === b[k]; }); }
  function card(it, path) {
    var b = el("button", "pc " + it.d, DIRS[it.d][2]);
    b.dataset.path = path.join("-");
    if (samePath(G.sel, path)) b.className += " sel";
    b.onclick = function (e) { e.stopPropagation(); if (G.running) return; G.sel = samePath(G.sel, path) ? null : path; renderProg(); };
    return b;
  }
  function loopBox(it, i) {
    var box = el("div", "loopbox" + (samePath(G.sel, [i]) ? " sel" : ""));
    box.dataset.path = String(i);
    var head = el("div", "head");
    head.appendChild(el("span", null, "🔁 ทำซ้ำ"));
    var n = el("button", "nbtn", it.n + " ครั้ง");
    n.onclick = function (e) { e.stopPropagation(); if (G.running) return; it.n = it.n >= 9 ? 2 : it.n + 1; beep(600, 0.05); renderProg(); };
    head.appendChild(n);
    var pick = el("button", "small", samePath(G.sel, [i]) ? "เลือกอยู่" : "เลือกกล่อง");
    pick.onclick = function (e) { e.stopPropagation(); if (G.running) return; G.sel = samePath(G.sel, [i]) ? null : [i]; renderProg(); };
    head.appendChild(pick);
    box.appendChild(head);
    if (!it.b.length) box.appendChild(el("span", "empty", "ว่าง — แตะลูกศรเพื่อใส่การ์ด"));
    it.b.forEach(function (x, j) { box.appendChild(card(x, [i, j])); });
    return box;
  }
  function sleep(ms) { return new Promise(function (r) { G.timer = setTimeout(r, ms); }); }
  function clearMarks() {
    document.querySelectorAll("#prog .run,#prog .err").forEach(function (e) { e.classList.remove("run", "err"); });
  }
  function markPath(path, cls) {
    var sel = path.length > 1 ? '[data-path="' + path.join("-") + '"]' : '[data-path="' + path[0] + '"]';
    var e = document.querySelector("#prog " + sel);
    if (e) e.classList.add(cls);
  }
  async function run() {
    if (G.running) return;
    if (!G.prog.length) { setMsg("ใส่การ์ดก่อนนะ", "bad"); return; }
    var l = G.level, sim = simulate(G.g, G.prog), token = {};
    G.token = token; G.running = true; G.sel = null; renderProg(); clearMarks();
    $("run").disabled = true;
    placeRobot(G.g.s, true);
    setMsg("หุ่นยนต์กำลังเดิน…", "");
    var rb = $("robot");
    for (var i = 0; i < sim.steps.length; i++) {
      if (G.token !== token) return;
      clearMarks(); markPath(sim.steps[i].path, "run");
      if (sim.trail[i]) { placeRobot(sim.trail[i]); beep(420 + (i % 5) * 40, 0.08); }
      else {
        // collision on this step
        markPath(sim.steps[i].path, "err");
        rb.classList.add("bump"); beep(160, 0.25, "square");
        await sleep(450); rb.classList.remove("bump");
        setMsg(sim.reason === "wall" ? "ชนกำแพง! มีบั๊ก 🐞 ลองแก้การ์ดสีแดง" : "ตกขอบ! มีบั๊ก 🐞 ลองแก้การ์ดสีแดง", "bad");
        finish(); return;
      }
      await sleep(430);
    }
    if (G.token !== token) return;
    clearMarks();
    if (sim.ok) {
      var cards = count(G.prog), st = starsFor(cards, l.par);
      beep(660, 0.12); setTimeout(function () { beep(880, 0.18); }, 130);
      if (!G.custom) { if ((progress[l.id] || 0) < st) { progress[l.id] = st; save(); } $("gstars").textContent = starStr(progress[l.id]); }
      var extra = [];
      if (G.custom) {
        if (G.fromMaker) {
          var sb = el("button", "small", "🔗 ส่งให้เพื่อน"); sb.onclick = shareMaze; extra.push(sb);
          var eb = el("button", "small", "✏️ แก้ด่าน"); eb.onclick = function () { openMaker(true); }; extra.push(eb);
        } else { var mb = el("button", "small", "⬅ เมนู"); mb.onclick = toMenu; extra.push(mb); }
      } else {
        var nx = LEVELS.filter(function (x) { return x.id === l.id + 1; })[0];
        if (nx) { var nb = el("button", "small", "ด่านต่อไป ➡"); nb.onclick = function () { openLevel(nx); }; extra.push(nb); }
      }
      setMsg("เก่งมาก! 🎉 " + starStr(st) + (st < 3 ? " (ใช้การ์ดน้อยลงได้ดาวเพิ่ม)" : ""), "good", extra);
    } else setMsg("ยังไม่ถึงดาว ลองดูอีกครั้ง 🔍", "bad");
    finish();
  }
  function finish() { G.running = false; $("run").disabled = false; }
  function retry() {
    if (G.token) G.token = null;
    clearTimeout(G.timer); G.running = false; $("run").disabled = false;
    $("robot").classList.remove("bump"); clearMarks(); placeRobot(G.g.s, true);
    setMsg(G.level.tip || "", "");
  }
  function clearAll() {
    if (G.running) return;
    G.prog = []; G.sel = null; retry(); renderProg();
  }
  function toMenu() { if (G) { G.token = null; clearTimeout(G.timer); } renderMenu(); show("menu"); }

  // ---------- maker ----------
  var MK = { rows: null, tool: "S" };
  function newGrid() {
    var r = []; for (var i = 0; i < 5; i++) r.push(".....".split(""));
    r[4][0] = "S"; r[0][4] = "*"; return r;
  }
  function openMaker(keep) {
    if (!(keep === true && MK.rows)) MK.rows = newGrid();
    renderMaker(); $("mmsg").textContent = ""; show("maker");
  }
  function mazeRows() { return MK.rows.map(function (r) { return r.join(""); }); }
  function renderMaker() {
    var g = parse(mazeRows()), b = $("mboard"); b.textContent = "";
    var cell = Math.min(Math.floor(Math.min(window.innerWidth - 36, 420) / g.C), 72);
    b.style.width = cell * g.C + 8 + "px";
    b.style.gridTemplateColumns = "repeat(" + g.C + "," + cell + "px)";
    b.style.setProperty("--fs", Math.round(cell * 0.62) + "px");
    for (var r = 0; r < g.R; r++) for (var c = 0; c < g.C; c++) {
      var ch = MK.rows[r][c], d = el("div", "cell" + (ch === "X" ? " wall" : ""));
      d.style.height = cell + "px"; d.dataset.r = r; d.dataset.c = c;
      d.textContent = ch === "X" ? "🧱" : ch === "*" ? "⭐" : ch === "S" ? "🤖" : "";
      d.onclick = (function (rr, cc) { return function () { paint(rr, cc); }; })(r, c);
      b.appendChild(d);
    }
  }
  function paint(r, c) {
    var t = MK.tool;
    if (t === "S" || t === "*") {
      MK.rows.forEach(function (row, i) { row.forEach(function (v, j) { if (v === t) MK.rows[i][j] = "."; }); });
    }
    var cur = MK.rows[r][c];
    if (t === "X" && cur === "X") MK.rows[r][c] = ".";
    else MK.rows[r][c] = t;
    beep(500, 0.05); renderMaker();
  }
  function playMaze() {
    var rows = mazeRows(), g = parse(rows);
    if (!g.s || !g.star) { $("mmsg").textContent = "ต้องมีทั้ง 🤖 จุดเริ่ม และ ⭐ ดาว"; return; }
    var sp = shortest(g);
    if (sp < 0) { $("mmsg").textContent = "หุ่นยนต์ไปไม่ถึงดาว 😢 ลองเปิดทางให้หน่อย"; return; }
    var lvl = { id: 0, rows: rows.map(function (r) { return r.replace(/X/g, "#"); }), loops: true, par: sp, mine: true, tip: "ลองเล่นด่านของเธอเองก่อน" };
    openLevel(lvl, true); G.fromMaker = true;
  }
  function mazeCode() { return mazeRows().join(","); }
  function shareMaze() {
    var url = location.origin + location.pathname + "#maze=" + mazeCode();
    var done = function () { setMsg("คัดลอกลิงก์แล้ว! ส่งให้เพื่อนได้เลย 🔗", "good"); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(url).then(done, function () { window.prompt("คัดลอกลิงก์นี้", url); });
    else window.prompt("คัดลอกลิงก์นี้", url);
  }
  function mazeFromHash() {
    var h = location.hash || "";
    if (h.indexOf("#maze=") !== 0) return null;
    var rows = h.slice(6).split(",");
    if (rows.length < 3 || rows.length > 8) return null;
    var w = rows[0].length;
    if (w < 3 || w > 8) return null;
    var ok = rows.every(function (r) { return r.length === w && /^[S.X*]+$/.test(r); });
    var all = rows.join("");
    if (!ok || (all.match(/S/g) || []).length !== 1 || (all.match(/\*/g) || []).length !== 1) return null;
    var lvl = { id: 0, rows: rows.map(function (r) { return r.replace(/X/g, "#"); }), loops: true, tip: "นี่คือเขาวงกตที่เพื่อนสร้าง" };
    var g = parse(lvl.rows), sp = shortest(g);
    if (sp < 0) return null;
    lvl.par = sp; return lvl;
  }

  // ---------- wiring ----------
  document.querySelectorAll("#pad [data-d]").forEach(function (b) { b.onclick = function () { addMove(b.dataset.d); }; });
  $("addLoop").onclick = addLoop; $("del").onclick = del; $("run").onclick = run;
  $("retry").onclick = retry; $("clear").onclick = clearAll;
  $("endLoop").onclick = function () { if (G.running) return; G.sel = null; renderProg(); };
  $("back").onclick = toMenu; $("mback").onclick = toMenu;
  document.querySelectorAll("#mpad [data-tool]").forEach(function (b) {
    b.onclick = function () {
      MK.tool = b.dataset.tool;
      document.querySelectorAll("#mpad [data-tool]").forEach(function (x) { x.classList.toggle("on", x === b); });
    };
  });
  $("mplay").onclick = playMaze;
  $("mute").textContent = muted ? "🔇" : "🔊";
  $("mute").onclick = function () { muted = !muted; $("mute").textContent = muted ? "🔇" : "🔊"; try { localStorage.setItem("bu_a1_mute", muted ? "1" : "0"); } catch (e) {} };
  $("reset").onclick = function (e) {
    e.preventDefault();
    if (confirm("ลบดาวที่สะสมไว้ในเครื่องนี้ทั้งหมด?")) { progress = {}; save(); renderMenu(); }
  };

  renderMenu();
  var friend = mazeFromHash();
  if (friend) openLevel(friend, true); else show("menu");
})();
</script>
</body>
