<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>render — ลบแบบมีการกระจาย (v2)</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@600;700&family=IBM+Plex+Sans+Thai:wght@500;600;700&display=swap">
<style>
  html,body{margin:0;padding:0;background:#000;overflow:hidden}
  canvas{display:block}
  img{display:none}
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<img id="imgHero" src="assets/kao-hero.png" alt="">
<img id="imgArms" src="assets/kao-arms.png" alt="">
<img id="imgFace" src="assets/kao-face.png" alt="">
<script>
/* ────────────────────────────────────────────────────────────────
   v2 — ใส่ครูเก้าเข้าไปในเฟรม · ย่อเหลือ 31 วินาที · บทใหม่ · ปรับหน้าตา

   หน้านี้ไม่ได้มีไว้เปิดดู — มีไว้ให้ capture.mjs เรียก drawAt(t) ทีละเฟรม
   ทุกอย่างเป็นฟังก์ชันของเวลา t (มิลลิวินาที) เรนเดอร์ซ้ำได้ภาพเดิมเป๊ะ

   โครง 3 องก์ตาม VIDEO_GUIDE
     ฮุก   — ภาพครูเก้าเต็มเฟรม (หน้าคน + บริบท ใน 2 วินาทีแรก)
     สอน   — กระดานโคมไฟ มีตราหน้าครูอยู่หัวคลิปตลอด
     ปิด   — ครูเก้ากอดอก + CTA
   ภาพครูตัดจาก docs/CHARACTER_SHEET.md ฉบับจริง ไม่ได้สร้างใหม่จากข้อความ
   ──────────────────────────────────────────────────────────────── */

const W = 1080, H = 1920;
const cv = document.getElementById("c");
const g = cv.getContext("2d");
const IMG = {
  hero: document.getElementById("imgHero"),
  arms: document.getElementById("imgArms"),
  face: document.getElementById("imgFace")
};

const C = {
  bg0:"#0d1830", bg1:"#0a1326", glow:"#1b2d57",
  lantern:"#ffc24a", hot:"#fff0c9", deep:"#c8871f",
  blue:"#52a8ff", ink:"#eaf1fc", ink2:"#9db1d4", ink3:"#64779c",
  rack:"#16254a", rackLine:"#1f3566", bad:"#ff8071", capBg:"rgba(6,12,26,.9)"
};
const NAVY = "10,19,38";

const DISPLAY = "'Bai Jamjuree','IBM Plex Sans Thai',sans-serif";
const BODY    = "'IBM Plex Sans Thai','Bai Jamjuree',sans-serif";

/* ── ไทม์ไลน์ 7 จังหวะ รวม 31 วินาที (v1 ยาว 38 วิ ช้าไป) ───── */
const BEATS = [
  { ms:2900, lines:[["ลูกบวกลบคล่อง","ink"],["แต่เจอ 52 − 7 แล้วนิ่ง","lantern"]] },
  { ms:3900, lines:[["52 คือ โคมสิบ 5 ดวง","ink"],["กับโคมหนึ่งอีก 2 ดวง","ink"]] },
  { ms:4300, lines:[["ต้องเอาออก 7","ink"],["แต่โคมหนึ่งมีแค่ 2 — ไม่พอ","bad"]] },
  { ms:5600, lines:[["ยืมโคมสิบมา 1 ดวง","ink"],["แตกออกเป็นโคมหนึ่ง 10 ดวง","lantern"]] },
  { ms:5400, lines:[["ได้โคมหนึ่ง 12 ดวง","ink"],["ทีนี้เอาออก 7 ได้แล้ว","lantern"]] },
  { ms:4600, lines:[["เหลือโคมสิบ 4 โคมหนึ่ง 5","ink"],["52 − 7 = 45","lantern"]] },
  { ms:4300, lines:[["ลูกติดตรงไหน ครูรู้ตรงนั้น","ink"],["ทดลองเรียนฟรี · 065 447 4691","lantern"]] }
];
const STARTS = [];
(function(){ let a=0; for (const b of BEATS){ STARTS.push(a); a += b.ms; } })();
const TOTAL = STARTS[6] + BEATS[6].ms;      /* 31000 */
window.TOTAL_MS = TOTAL;

const T_SCENE = STARTS[1];   /* ฮุก → กระดาน */
const T_CTA   = STARTS[6];   /* กระดาน → ปิดท้าย */
const XF = 220;              /* ครึ่งหนึ่งของช่วงครอสเฟด */

/* ── ตัวช่วย ─────────────────────────────────────────────────── */
const cl  = (v,a,b) => v < a ? a : v > b ? b : v;
const p01 = (t,a,b) => cl((t-a)/(b-a), 0, 1);
const outC = x => 1 - Math.pow(1-x, 3);
const inC  = x => x*x*x;

function beatOf(t){ let i=0; for (let k=0;k<BEATS.length;k++) if (t >= STARTS[k]) i=k; return i; }

function glowDot(x,y,r,col,blur,alpha){
  g.save(); g.globalAlpha *= (alpha===undefined?1:alpha);
  g.shadowColor = col; g.shadowBlur = blur;
  const gr = g.createRadialGradient(x-r*0.3, y-r*0.35, r*0.1, x, y, r);
  gr.addColorStop(0, C.hot); gr.addColorStop(.62, col); gr.addColorStop(1, C.deep);
  g.fillStyle = gr; g.beginPath(); g.arc(x,y,r,0,Math.PI*2); g.fill(); g.restore();
}
function rr(x,y,w,h,r){ g.beginPath(); g.roundRect(x,y,w,h,r); }
function text(s,x,y,font,col,align){
  g.save(); g.font = font; g.fillStyle = col;
  g.textAlign = align||"left"; g.textBaseline = "alphabetic";
  g.fillText(s,x,y); g.restore();
}
/* วาดรูปแบบ cover ลงกรอบที่กำหนด */
function coverInto(ctx,img,x,y,w,h){
  if (!img || !img.naturalWidth) return;
  const s = Math.max(w/img.naturalWidth, h/img.naturalHeight);
  const dw = img.naturalWidth*s, dh = img.naturalHeight*s;
  ctx.drawImage(img, x+(w-dw)/2, y+(h-dh)/2, dw, dh);
}
const cover = (img,x,y,w,h) => coverInto(g,img,x,y,w,h);

/* รูปที่ขอบถูก "ลบ" ให้โปร่งจริงด้วย destination-out
   (ถ้าใช้วิธีทาสีพื้นหลังทับ จะเห็นเป็นกรอบสี่เหลี่ยม เพราะสีที่ทาไม่ตรงกับฉากข้างหลังเป๊ะ)
   เนื้อภาพไม่เปลี่ยนตามเวลา จึงสร้างครั้งเดียวแล้วเก็บไว้ใช้ซ้ำทุกเฟรม */
function featheredImage(img, bw, bh, dark, fadeTop, fadeBottom, fadeLeft){
  const off = document.createElement("canvas");
  off.width = bw; off.height = bh;
  const o = off.getContext("2d");
  coverInto(o, img, 0, 0, bw, bh);
  if (dark > 0){ o.fillStyle = "rgba("+NAVY+","+dark+")"; o.fillRect(0,0,bw,bh); }

  o.globalCompositeOperation = "destination-out";
  const ramp = (x0,y0,x1,y1,stops) => {
    const gr = o.createLinearGradient(x0,y0,x1,y1);
    for (const s of stops) gr.addColorStop(s[0], "rgba(0,0,0,"+s[1]+")");
    return gr;
  };
  if (fadeTop){
    o.fillStyle = ramp(0,0,0,fadeTop,[[0,1],[1,0]]); o.fillRect(0,0,bw,fadeTop);
  }
  if (fadeBottom){
    o.fillStyle = ramp(0,bh-fadeBottom,0,bh,[[0,0],[1,1]]); o.fillRect(0,bh-fadeBottom,bw,fadeBottom);
  }
  if (fadeLeft){
    o.fillStyle = ramp(0,0,fadeLeft,0,[[0,1],[.38,.72],[1,0]]); o.fillRect(0,0,fadeLeft,bh);
  }
  o.globalCompositeOperation = "source-over";
  return off;
}
function vgrad(x,y,w,h,stops){
  const lg = g.createLinearGradient(x,y,x,y+h);
  for (const s of stops) lg.addColorStop(s[0], s[1]);
  g.fillStyle = lg; g.fillRect(x,y,w,h);
}

/* ── ตำแหน่งคงที่ (อยู่ในเขตปลอดภัย บน 15% ล่าง 20%) ────────── */
const RACK_W=110, RACK_H=190, RACK_GAP=40;
const RACK_Y=700, RACK_X0=(W-(5*RACK_W+4*RACK_GAP))/2;
const rackX = i => RACK_X0 + i*(RACK_W+RACK_GAP);

/* แถวละ 7 ดวง — "ต้องเอาออก 7" จึงอยู่ในแถวเดียวพอดี เห็นว่าขาดกี่ดวงทันที */
const ONE_R=34, ONE_GAP=110, ONE_PER=7, ONE_X0=210, ONE_Y0=1040, ONE_ROW=120;
const oneSlot = i => ({ x: ONE_X0 + (i%ONE_PER)*ONE_GAP, y: ONE_Y0 + Math.floor(i/ONE_PER)*ONE_ROW });

const CAP_X=40, CAP_Y=1296, CAP_W=1000, CAP_H=240;

/* ── พื้นหลัง ───────────────────────────────────────────────── */
const BOKEH = [];
(function(){
  let s = 20260308;
  const rnd = () => (s = (s*1103515245 + 12345) & 0x7fffffff) / 0x7fffffff;
  for (let i=0;i<10;i++) BOKEH.push({ x:60+rnd()*960, y:300+rnd()*1150, r:16+rnd()*34, ph:rnd()*6.28, sp:.35+rnd()*.5 });
})();

function background(t){
  vgrad(0,0,W,H,[[0,C.bg0],[1,C.bg1]]);
  const rg = g.createRadialGradient(W/2,-120,40, W/2,-120,900);
  rg.addColorStop(0, C.glow); rg.addColorStop(1, "rgba(27,45,87,0)");
  g.fillStyle = rg; g.fillRect(0,0,W,1000);

  g.save();
  for (const b of BOKEH){
    const yy = b.y + Math.sin(t/1000*b.sp + b.ph)*22;
    g.globalAlpha = .16; g.filter = "blur(16px)";
    g.fillStyle = C.lantern; g.beginPath(); g.arc(b.x, yy, b.r, 0, Math.PI*2); g.fill();
  }
  g.restore();
}

function vignette(){
  const rg = g.createRadialGradient(W/2,H*0.45,W*0.35, W/2,H*0.45,W*1.05);
  rg.addColorStop(0,"rgba(0,0,0,0)"); rg.addColorStop(1,"rgba(0,0,0,.42)");
  g.fillStyle = rg; g.fillRect(0,0,W,H);
}

/* ── องก์ 1 · ฮุก — ครูเก้าเต็มเฟรม ─────────────────────────── */
function hookFrame(t, a){
  g.save(); g.globalAlpha = a;

  const iy = 110, ih = 1180;
  cover(IMG.hero, 0, iy, W, ih);
  vgrad(0, iy, W, 300, [[0,"rgba("+NAVY+",1)"],[1,"rgba("+NAVY+",0)"]]);
  vgrad(0, 760, W, 540, [[0,"rgba("+NAVY+",0)"],[.55,"rgba("+NAVY+",.85)"],[1,"rgba("+NAVY+",1)"]]);
  g.fillStyle = "rgba("+NAVY+",1)"; g.fillRect(0, iy+ih, W, H-iy-ih);

  /* สมการใหญ่บนพื้นมืด */
  const pop = outC(p01(t, 300, 900));
  g.globalAlpha = a * pop;
  g.save();
  g.font = "700 150px "+DISPLAY; g.textAlign = "center"; g.textBaseline = "alphabetic";
  g.shadowColor = "rgba(255,194,74,.3)"; g.shadowBlur = 55;
  g.fillStyle = C.ink;
  g.fillText("52 − 7 = ?", W/2, 1180 + (1-pop)*18);
  g.restore();

  g.restore();
}

/* ── องก์ 3 · ปิดท้าย — ครูเก้ากอดอก ────────────────────────── */
let ctaCache = null;
function ctaFrame(t, a){
  g.save(); g.globalAlpha = a;

  /* ล้นขอบขวาออกไป ขอบบน-ซ้าย-ล่างลบให้โปร่ง จึงกลืนไปกับฉากกลางคืน */
  const slide = (1 - outC(p01(t, T_CTA, T_CTA+700))) * 70;
  const bw = 560, bh = 820, bx = W - bw + 45 + slide, by = 600;
  if (!ctaCache) ctaCache = featheredImage(IMG.arms, bw, bh, .34, 170, 250, 350);
  g.drawImage(ctaCache, bx, by);

  g.restore();
}

/* ── หัวคลิป — ตราหน้าครูเก้า + จุดบอกขั้น ──────────────────── */
function header(t, beat){
  const cx = 104, cy = 340, r = 46;

  g.save();
  g.shadowColor = C.blue; g.shadowBlur = 22 + 8*Math.sin(t/520);
  g.beginPath(); g.arc(cx, cy, r+3, 0, Math.PI*2);
  g.fillStyle = C.rack; g.fill(); g.restore();

  g.save();
  g.beginPath(); g.arc(cx, cy, r, 0, Math.PI*2); g.clip();
  cover(IMG.face, cx-r, cy-r, r*2, r*2);
  g.restore();

  g.save(); g.beginPath(); g.arc(cx, cy, r, 0, Math.PI*2);
  g.strokeStyle = C.blue; g.lineWidth = 3; g.stroke(); g.restore();

  text("ครูเก้า", 170, 332, "600 40px "+DISPLAY, C.ink);
  text("คณิต ป.2–3", 170, 374, "500 30px "+BODY, C.ink3);

  for (let i=0;i<BEATS.length;i++){
    const x = W - 60 - (BEATS.length-1-i)*30;
    g.save(); g.globalAlpha = i <= beat ? 1 : .28;
    if (i === beat){ g.shadowColor = C.lantern; g.shadowBlur = 14; }
    g.fillStyle = i <= beat ? C.lantern : C.ink3;
    g.beginPath(); g.arc(x, 340, i === beat ? 8 : 6, 0, Math.PI*2); g.fill(); g.restore();
  }
}

/* ── สมการกลางจอ (องก์สอน) ──────────────────────────────────── */
function equation(t){
  const showRes = t >= STARTS[5];
  const a = showRes ? outC(p01(t, STARTS[5], STARTS[5]+650)) : 0;

  g.save(); g.font = "700 150px "+DISPLAY; g.textAlign = "left"; g.textBaseline = "alphabetic";
  const s1="52 ", s2="− ", s3="7", s4="  = 45";
  const w1=g.measureText(s1).width, w2=g.measureText(s2).width, w3=g.measureText(s3).width;
  const w4=g.measureText(s4).width;
  let x = (W - (w1+w2+w3 + w4*a))/2;
  g.shadowColor = "rgba(255,194,74,.26)"; g.shadowBlur = 50;
  g.fillStyle = C.ink;     g.fillText(s1,x,530); x += w1;
  g.fillStyle = C.lantern; g.fillText(s2,x,530); x += w2;
  g.fillStyle = C.ink;     g.fillText(s3,x,530); x += w3;
  if (a > 0){
    g.globalAlpha = a; g.fillStyle = C.lantern; g.fillText(s4,x,530);
    g.shadowBlur = 24; g.fillRect(x+10, 556, (w4-20)*a, 5);
  }
  g.restore();
}

/* ── โคมสิบ (แร็กไฟ 10 ดวง) ─────────────────────────────────── */
function drawRack(x, y, lift, scale, alpha, hot){
  g.save(); g.globalAlpha *= alpha;
  g.translate(x + RACK_W/2, y + RACK_H/2 - lift);
  g.scale(scale, scale);
  g.translate(-RACK_W/2, -RACK_H/2);

  const lg = g.createLinearGradient(0,0,0,RACK_H);
  lg.addColorStop(0, C.rack); lg.addColorStop(1, "#101c3a");
  g.fillStyle = lg;
  g.strokeStyle = hot ? C.lantern : C.rackLine; g.lineWidth = hot ? 3 : 2;
  rr(0,0,RACK_W,RACK_H,16); g.fill(); g.stroke();

  g.strokeStyle = C.rackLine; g.lineWidth = 2;
  g.beginPath(); g.moveTo(RACK_W/2-16,-2); g.quadraticCurveTo(RACK_W/2,-18, RACK_W/2+16,-2); g.stroke();

  for (let r=0;r<5;r++) for (let c=0;c<2;c++)
    glowDot(28 + c*54, 30 + r*34, 11, C.lantern, 14, 1);
  g.restore();
}

function racks(t){
  const bs = STARTS[3];
  const lift  = outC(p01(t, bs+550,  bs+1200)) * 46;
  const burst = p01(t, bs+1200, bs+1600);
  const gone  = p01(t, bs+1400, bs+1800);
  const beckon = (t > bs+120 && t < bs+820) ? Math.sin((t-bs)/110)*7 : 0;

  for (let i=0;i<5;i++){
    if (i < 4 || t < bs){ drawRack(rackX(i), RACK_Y, 0, 1, 1, false); continue; }
    drawRack(rackX(i), RACK_Y, lift + beckon, 1 + burst*0.16, 1 - gone, true);
  }

  const n = t >= bs+1800 ? 4 : 5;
  text("โคมสิบ", 185, 650, "500 32px "+BODY, C.ink3);
  text("× "+n, 303, 650, "600 32px "+BODY, C.ink2);
}

/* ── โคมหนึ่ง ───────────────────────────────────────────────── */
function ones(t){
  const bB = STARTS[3], bS = STARTS[4];
  const srcX = rackX(4) + RACK_W/2, srcY = RACK_Y + RACK_H/2;

  /* ช่องว่างเส้นประ — ให้เห็นว่ายังขาดอีก 5 */
  if (t >= STARTS[2] && t < bB + 1600){
    const a = outC(p01(t, STARTS[2], STARTS[2]+450)) * (1 - p01(t, bB+1200, bB+1600));
    g.save(); g.globalAlpha = a; g.setLineDash([9,9]); g.lineWidth = 4; g.strokeStyle = C.bad;
    for (let i=2;i<7;i++){ const s = oneSlot(i); g.beginPath(); g.arc(s.x, s.y, ONE_R, 0, Math.PI*2); g.stroke(); }
    g.restore();
  }

  let lit = 0;
  for (let i=0;i<12;i++){
    let x, y, a = 1, r = ONE_R;
    const s = oneSlot(i);

    if (i < 2){
      if (t < STARTS[1]) continue;
      a = outC(p01(t, STARTS[1]+150 + i*150, STARTS[1]+700 + i*150));
      x = s.x; y = s.y;
      if (t >= STARTS[2]+500 && t < bB)
        x += Math.sin((t-STARTS[2])/55) * 7 * (1 - p01(t, STARTS[2]+500, STARTS[2]+2200));
    } else {
      const t0 = bB + 1500 + (i-2)*105;
      if (t < t0) continue;
      const k = outC(p01(t, t0, t0+600));
      x = srcX + (s.x - srcX)*k;
      y = srcY + (s.y - srcY)*k - Math.sin(Math.PI*k)*70;
      r = ONE_R * (0.45 + 0.55*k);
    }

    /* ลอยหายไป 7 ดวง (ดวงที่ 6–12) */
    if (i >= 5 && t >= bS + 450){
      const t0 = bS + 450 + (11-i)*210;
      const k = p01(t, t0, t0+520);
      if (k > 0){ y -= inC(k)*120; a *= (1-k); r *= (1 - .5*k); }
      if (k >= 1) continue;
    }

    glowDot(x, y + Math.sin(t/900 + i)*4, r, C.lantern, 18, a);
    if (a > .55) lit++;
  }

  let n;
  if (t < STARTS[1]) n = 0;
  else if (t < bB+1500) n = 2;
  else if (t < bS+450)  n = Math.max(2, lit);   /* นับขึ้น 2 → 12 ตามดวงที่ลอยมาถึง */
  else n = Math.max(5, lit);                     /* นับลง 12 → 5 ตามดวงที่ลอยออก */
  text("โคมหนึ่ง", 185, 970, "500 32px "+BODY, C.ink3);
  text("× "+n, 325, 970, "600 32px "+BODY, C.ink2);
}

/* ── สรุปคำตอบ ──────────────────────────────────────────────── */
function tally(t){
  if (t < STARTS[5]) return;
  const a = outC(p01(t, STARTS[5]+350, STARTS[5]+1000));
  g.save(); g.globalAlpha = a; g.textBaseline = "alphabetic"; g.textAlign = "left";
  g.font = "600 40px "+DISPLAY;
  const s1 = "โคมสิบ 4  +  โคมหนึ่ง 5  =  ", s2 = "45";
  const x0 = (W - (g.measureText(s1).width + g.measureText(s2).width))/2;
  g.fillStyle = C.ink2;    g.fillText(s1, x0, 1262);
  g.shadowColor = C.lantern; g.shadowBlur = 26;
  g.fillStyle = C.lantern; g.fillText(s2, x0 + g.measureText(s1).width, 1262);
  g.restore();
}

/* ── องก์ 2 · กระดานโคมไฟ ───────────────────────────────────── */
function teachFrame(t, a){
  g.save(); g.globalAlpha = a;
  racks(t); ones(t); tally(t);   /* สมการวาดแยกใน drawAt เพราะต้องค้างถึงองก์ปิดท้าย */
  g.restore();
}

/* ── ซับไทเทิล ──────────────────────────────────────────────── */
const COL = { ink:C.ink, lantern:C.lantern, bad:C.bad };

function caption(t, beat){
  const b = BEATS[beat], st = STARTS[beat];
  const a = outC(p01(t, st, st+300));

  g.save(); g.globalAlpha = a;
  g.fillStyle = C.capBg; rr(CAP_X, CAP_Y, CAP_W, CAP_H, 24); g.fill();
  g.strokeStyle = "rgba(255,194,74,.18)"; g.lineWidth = 2; g.stroke();

  g.textAlign = "center"; g.textBaseline = "alphabetic";
  for (let i=0;i<b.lines.length;i++){
    const k = outC(p01(t, st + i*100, st + 400 + i*100));
    g.globalAlpha = a * k;
    g.font = "600 60px "+DISPLAY;
    g.fillStyle = COL[b.lines[i][1]];
    g.fillText(b.lines[i][0], W/2, CAP_Y + 98 + i*84 + (1-k)*14);
  }
  g.restore();
}

/* ── แถบเวลา + บรรทัดที่อยู่ (อยู่ในเขตที่ UI แอปบังได้ ไม่เสียหาย) ── */
function footer(t){
  const x = CAP_X, y = 1572, w = CAP_W;
  g.fillStyle = "rgba(255,255,255,.09)"; rr(x,y,w,7,4); g.fill();
  g.save(); g.shadowColor = C.lantern; g.shadowBlur = 16;
  g.fillStyle = C.lantern; rr(x, y, Math.max(7, w*cl(t/TOTAL,0,1)), 7, 4); g.fill(); g.restore();

  text("ซอยวัดหลวงพ่อโต บางพลี", W/2, 1712, "500 32px "+BODY, "rgba(157,177,212,.38)", "center");
}

/* ── เฟรมเดียว ──────────────────────────────────────────────── */
function drawAt(t){
  const beat = beatOf(t);

  const toScene = p01(t, T_SCENE-XF, T_SCENE+XF);
  const toCta   = p01(t, T_CTA-XF,   T_CTA+XF);
  const aHook  = 1 - toScene;
  const aTeach = toScene * (1 - toCta);
  const aCta   = toCta;

  background(t);
  if (aHook  > 0.002) hookFrame(t, aHook);
  if (aTeach > 0.002) teachFrame(t, aTeach);
  if (aCta   > 0.002) ctaFrame(t, aCta);
  if (aCta   > 0.002 || aTeach > 0.002){
    g.save(); g.globalAlpha = Math.max(aTeach, aCta); equation(t); g.restore();
  }
  vignette();
  header(t, beat);
  caption(t, beat);
  footer(t);
  return true;
}
window.drawAt = drawAt;

window.ASSETS_READY = Promise.all(
  Object.values(IMG).map(im => im.complete
    ? Promise.resolve()
    : new Promise(r => { im.onload = r; im.onerror = r; }))
).then(() => Object.values(IMG).every(im => im.naturalWidth > 0));

drawAt(0);
</script>
