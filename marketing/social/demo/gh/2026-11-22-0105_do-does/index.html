<!doctype html>
<html lang="th" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>ศัพท์ ป.5 do does</title>
    <script src="gsap.min.js"></script>
    <script src="timing.js"></script>
    <script src="captions.js"></script>
    <script src="motion.js"></script>
    <script src="lesson.js"></script>
    <link rel="stylesheet" href="look.css" />
  </head>
  <body>
    <!-- data-start / data-duration are rewritten by `lesson voice` from the real voice. One <section> per shot in captions.js. -->
    <div id="root" data-composition-id="main" data-start="0" data-duration="30.57" data-width="1080" data-height="1920">
      <div id="stage" class="clip" data-start="0" data-duration="30.57" data-track-index="0"><div id="grid"></div><div id="dots"></div></div>

      <section id="sc-hook" class="clip" data-shot="hook" data-start="0" data-duration="2.72" data-track-index="1"></section>
      <section id="sc-i1" class="clip" data-shot="i1" data-start="2.12" data-duration="5" data-track-index="2"></section>
      <section id="sc-i2" class="clip" data-shot="i2" data-start="6.52" data-duration="5.18" data-track-index="1"></section>
      <section id="sc-i3" class="clip" data-shot="i3" data-start="11.1" data-duration="5.71" data-track-index="2"></section>
      <section id="sc-i4" class="clip" data-shot="i4" data-start="16.21" data-duration="5.48" data-track-index="1"></section>
      <section id="sc-tip" class="clip" data-shot="tip" data-start="21.09" data-duration="5.43" data-track-index="2"></section>
      <section id="sc-end" class="clip" data-shot="end" data-start="25.92" data-duration="4.65" data-track-index="1"></section>

      <audio id="vo" src="assets/voice/voiceover.wav" data-start="0" data-duration="30.57" data-track-index="8" data-volume="1"></audio>
      <div id="captions" class="clip" data-start="0" data-duration="30.57" data-track-index="5"></div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      const M = Motion(tl);
      const L = Lesson(tl, M);
      const B = (k, w) => (w ? M.atW(k, w) : M.at(k));     // B("a1") line start · B("a1","and") when that word is spoken

      // One block per scene. A new composition every 2–4 s; something changes every 1–2 s (tile / chip / card reveals).
      L.grid();
      L.hook("#sc-hook", { eyebrow: "GRAMMAR · ป.5", a: "do", b: "does?", tb: B("a1", "does") });
      L.define("#sc-i1", { eyebrow: "01 · DO", term: "do", meaning: "ช่วยถาม", sub: "ฉัน เธอ เรา", y: 430, size: 170, tm: B("b1", "ช่วยถาม"), ts: B("b1", "ฉัน"), example: { text: "[Do] you like fish?", gloss: "คุณชอบปลาไหม", t: B("b1x"), hit: B("b1x", "Do") } });
      L.define("#sc-i2", { eyebrow: "02 · DOES", term: "does", meaning: "ช่วยถาม", sub: "เขา เธอ มัน", y: 430, size: 170, tm: B("b2", "ช่วยถาม"), ts: B("b2", "เขา"), example: { text: "[Does] she play tennis?", gloss: "เธอเล่นเทนนิสไหม", t: B("b2x"), hit: B("b2x", "Does") } });
      L.define("#sc-i3", { eyebrow: "03 · DON'T", term: "don't", meaning: "ไม่", sub: "ปฏิเสธ", y: 430, size: 170, tm: B("b3", "แปลว่า"), ts: B("b3", "ปฏิเสธ"), example: { text: "I [don't] eat meat.", gloss: "ฉันไม่กินเนื้อสัตว์", t: B("b3x"), hit: B("b3x", "don't") } });
      L.define("#sc-i4", { eyebrow: "04 · DOESN'T", term: "doesn't", meaning: "ไม่", sub: "ปฏิเสธ", y: 430, size: 170, tm: B("b4", "แปลว่า"), ts: B("b4", "ปฏิเสธ"), example: { text: "She [doesn't] eat meat.", gloss: "เธอไม่กินเนื้อสัตว์", t: B("b4x"), hit: B("b4x", "doesn't") } });
      L.tip("#sc-tip", { title: "หลัง does ไม่เติม s", sub: "กริยาใช้ช่องเดิม", card: { label: "VERB", text: "Does he [like] cats?", gloss: "เขาชอบแมวไหม", t: B("g1", "like"), hit: B("g2") } });
      L.outro("#sc-end", { word: "do·does", sub: "I do · she does", pills: ["SAVE", "FOLLOW"], tp: B("h1", "เซฟ") });
      L.dots(["#sc-hook", "#sc-i1", "#sc-i2", "#sc-i3", "#sc-i4", "#sc-tip", "#sc-end"]);
      M.subtitles();
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
