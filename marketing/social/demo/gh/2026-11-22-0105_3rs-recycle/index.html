<!doctype html>
<html lang="th" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>ศัพท์ ป.5 ช่วยโลก 3R</title>
    <script src="gsap.min.js"></script>
    <script src="timing.js"></script>
    <script src="captions.js"></script>
    <script src="motion.js"></script>
    <script src="lesson.js"></script>
    <link rel="stylesheet" href="look.css" />
  </head>
  <body>
    <!-- data-start / data-duration are rewritten by `lesson voice` from the real voice. One <section> per shot in captions.js. -->
    <div id="root" data-composition-id="main" data-start="0" data-duration="29.75" data-width="1080" data-height="1920">
      <div id="stage" class="clip" data-start="0" data-duration="29.75" data-track-index="0"><div id="grid"></div><div id="dots"></div></div>

      <section id="sc-hook" class="clip" data-shot="hook" data-start="0" data-duration="3" data-track-index="1"></section>
      <section id="sc-i1" class="clip" data-shot="i1" data-start="2.4" data-duration="5.45" data-track-index="2"></section>
      <section id="sc-i2" class="clip" data-shot="i2" data-start="7.25" data-duration="5.05" data-track-index="1"></section>
      <section id="sc-i3" class="clip" data-shot="i3" data-start="11.7" data-duration="5.6" data-track-index="2"></section>
      <section id="sc-i4" class="clip" data-shot="i4" data-start="16.7" data-duration="4.48" data-track-index="1"></section>
      <section id="sc-tip" class="clip" data-shot="tip" data-start="20.58" data-duration="5.23" data-track-index="2"></section>
      <section id="sc-end" class="clip" data-shot="end" data-start="25.21" data-duration="4.54" data-track-index="1"></section>

      <audio id="vo" src="assets/voice/voiceover.wav" data-start="0" data-duration="29.75" data-track-index="8" data-volume="1"></audio>
      <div id="captions" class="clip" data-start="0" data-duration="29.75" data-track-index="5"></div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      const M = Motion(tl);
      const L = Lesson(tl, M);
      const B = (k, w) => (w ? M.atW(k, w) : M.at(k));     // B("a1") line start · B("a1","and") when that word is spoken

      // One block per scene. A new composition every 2–4 s; something changes every 1–2 s (tile / chip / card reveals).
      L.grid();
      L.hook("#sc-hook", { eyebrow: "VOCAB · ป.5", a: "reduce", b: "reuse?", tb: B("a1", "reuse") });
      L.define("#sc-i1", { eyebrow: "01 · REDUCE", term: "reduce", meaning: "ลดการใช้", sub: "ใช้ให้น้อยลง", y: 430, size: 170, tm: B("b1", "แปลว่า"), ts: B("b1", "ใช้ให้น้อย"), example: { text: "We [reduce] plastic bags.", gloss: "เราลดการใช้ถุงพลาสติก", t: B("b1x"), hit: B("b1x", "reduce") } });
      L.define("#sc-i2", { eyebrow: "02 · REUSE", term: "reuse", meaning: "ใช้ซ้ำ", sub: "ใช้อีกครั้ง", y: 430, size: 170, tm: B("b2", "แปลว่า"), ts: B("b2", "ใช้อีกครั้ง"), example: { text: "I [reuse] glass bottles.", gloss: "ฉันใช้ขวดแก้วซ้ำ", t: B("b2x"), hit: B("b2x", "reuse") } });
      L.define("#sc-i3", { eyebrow: "03 · RECYCLE", term: "recycle", meaning: "รีไซเคิล", sub: "ทำใหม่", y: 430, size: 170, tm: B("b3", "แปลว่า"), ts: B("b3", "ทำใหม่"), example: { text: "Please [recycle] old paper.", gloss: "กรุณารีไซเคิลกระดาษเก่า", t: B("b3x"), hit: B("b3x", "recycle") } });
      L.define("#sc-i4", { eyebrow: "04 · BIN", term: "bin", meaning: "ถังขยะ", sub: "ทิ้งขยะ", y: 430, size: 170, tm: B("b4", "แปลว่า"), ts: B("b4", "ทิ้งขยะ"), example: { text: "Put it in the [bin].", gloss: "ทิ้งมันลงถังขยะ", t: B("b4x"), hit: B("b4x", "bin") } });
      L.tip("#sc-tip", { title: "rubbish = ขยะ", sub: "อเมริกันใช้ trash", card: { label: "WORD", text: "Please put [rubbish] in the bin.", gloss: "กรุณาทิ้งขยะลงถัง", t: B("g1", "rubbish"), hit: B("g2") } });
      L.outro("#sc-end", { word: "3R", sub: "reduce · reuse · recycle", pills: ["SAVE", "FOLLOW"], tp: B("h1", "เซฟ") });
      L.dots(["#sc-hook", "#sc-i1", "#sc-i2", "#sc-i3", "#sc-i4", "#sc-tip", "#sc-end"]);
      M.subtitles();
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
