<!doctype html>
<html lang="th" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>ศัพท์ ป.5 am is are</title>
    <script src="gsap.min.js"></script>
    <script src="timing.js"></script>
    <script src="captions.js"></script>
    <script src="motion.js"></script>
    <script src="lesson.js"></script>
    <link rel="stylesheet" href="look.css" />
  </head>
  <body>
    <!-- data-start / data-duration are rewritten by `lesson voice` from the real voice. One <section> per shot in captions.js. -->
    <div id="root" data-composition-id="main" data-start="0" data-duration="23.27" data-width="1080" data-height="1920">
      <div id="stage" class="clip" data-start="0" data-duration="23.27" data-track-index="0"><div id="grid"></div><div id="dots"></div></div>

      <section id="sc-hook" class="clip" data-shot="hook" data-start="0" data-duration="2.36" data-track-index="1"></section>
      <section id="sc-i1" class="clip" data-shot="i1" data-start="1.76" data-duration="4.13" data-track-index="2"></section>
      <section id="sc-i2" class="clip" data-shot="i2" data-start="5.29" data-duration="4.62" data-track-index="1"></section>
      <section id="sc-i3" class="clip" data-shot="i3" data-start="9.31" data-duration="5.02" data-track-index="2"></section>
      <section id="sc-tip" class="clip" data-shot="tip" data-start="13.73" data-duration="5.6" data-track-index="1"></section>
      <section id="sc-end" class="clip" data-shot="end" data-start="18.73" data-duration="4.54" data-track-index="2"></section>

      <audio id="vo" src="assets/voice/voiceover.wav" data-start="0" data-duration="23.27" data-track-index="8" data-volume="1"></audio>
      <div id="captions" class="clip" data-start="0" data-duration="23.27" data-track-index="5"></div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      const M = Motion(tl);
      const L = Lesson(tl, M);
      const B = (k, w) => (w ? M.atW(k, w) : M.at(k));     // B("a1") line start · B("a1","and") when that word is spoken

      // One block per scene. A new composition every 2–4 s; something changes every 1–2 s (tile / chip / card reveals).
      L.grid();
      L.hook("#sc-hook", { eyebrow: "GRAMMAR · ป.5", a: "am / is", b: "are?", tb: B("a1", "are") });
      L.define("#sc-i1", { eyebrow: "01 · AM", term: "am", meaning: "ใช้กับ I", sub: "เท่านั้น", y: 430, size: 170, tm: B("b1", "ใช้กับ"), ts: B("b1", "เท่านั้น"), example: { text: "I [am] a student.", gloss: "ฉันเป็นนักเรียน", t: B("b1x"), hit: B("b1x", "am") } });
      L.define("#sc-i2", { eyebrow: "02 · IS", term: "is", meaning: "he / she / it", sub: "คนเดียว", y: 430, size: 170, tm: B("b2", "ใช้กับ"), ts: B("b2", "คนเดียว"), example: { text: "She [is] my teacher.", gloss: "เธอเป็นครูของฉัน", t: B("b2x"), hit: B("b2x", "is") } });
      L.define("#sc-i3", { eyebrow: "03 · ARE", term: "are", meaning: "we / you / they", sub: "หลายคน", y: 430, size: 170, tm: B("b3", "ใช้กับ"), ts: B("b3", "หลายคน"), example: { text: "They [are] my friends.", gloss: "พวกเขาเป็นเพื่อนของฉัน", t: B("b3x"), hit: B("b3x", "are") } });
      L.tip("#sc-tip", { title: "ปฏิเสธ เติม not", sub: "หลัง am is are", card: { label: "NEGATIVE", text: "He is [not] tall.", gloss: "เขาไม่สูง", t: B("g1", "not"), hit: B("g2") } });
      L.outro("#sc-end", { word: "am·is·are", sub: "I am · he is · they are", pills: ["SAVE", "FOLLOW"], tp: B("h1", "เซฟ") });
      L.dots(["#sc-hook", "#sc-i1", "#sc-i2", "#sc-i3", "#sc-tip", "#sc-end"]);
      M.subtitles();
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
