<!doctype html>
<!-- Chalkboard skeleton. One <section data-shot> per shot in captions.js (`voice` retimes them).
     C.write / C.line / C.circle … draw chalk; C.erase wipes the page; T.say(key) lip-syncs the chalk teacher to a caption line. -->
<html lang="{{LANG}}" data-resolution="landscape" class="wide">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>{{TITLE}}</title>
    <script src="gsap.min.js"></script>
    <script src="timing.js"></script>
    <script src="captions.js"></script>
    <script src="motion.js"></script>
    <script src="stick2d-kit.js"></script>
    <script src="chalk-kit.js"></script>
    <link rel="stylesheet" href="look.css" />
    <link rel="stylesheet" href="chalk.css" />
  </head>
  <body class="theme-chalk">
    <div id="root" data-composition-id="main" data-start="0" data-duration="10" data-width="1920" data-height="1080">
      <div id="stage" class="clip" data-start="0" data-duration="10" data-track-index="0"></div>
      <section id="sc-hook" class="clip" data-shot="hook" data-start="0" data-duration="5" data-track-index="1"></section>
      <section id="sc-body" class="clip" data-shot="body" data-start="5" data-duration="5" data-track-index="2"></section>
      <audio id="vo" src="assets/voice/voiceover.wav" data-start="0" data-duration="10" data-track-index="8" data-volume="1"></audio>
      <div id="captions" class="clip" data-start="0" data-duration="10" data-track-index="5"></div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      const M = Motion(tl);
      const C = Chalk(tl, M);
      const { at, end, atW, TOTAL } = M, P = C.P;

      const T = C.teacher({ x: 1740, y: 800, s: 0.62 });      // 16:9: right edge; writing area x 70–1850, y 70–800 (nothing in x > 1590 below y 330), subtitles y 840–990
      C.ground(1600, 1880, 806);
      T.stick(); T.enter(0.12); T.sway(0.5, TOTAL, 1.6, 1.4);
      const talk = { gestures: ["talk2", "idle", "talk3", "idle"], end: "idle" };
      T.say("h1", talk); T.face(at("h1"), "think");
      T.say("b1", talk); T.face(atW("b1", "หก"), "grin");

      C.write("1+2+3", 800, 260, 170, at("h1") + 0.3, 1.6, { anchor: "middle" });          // digits + = × … ? are stroke-drawn; Thai is wiped in
      C.write("= ?", 800, 470, 150, end("h1") - 0.6, 0.6, { anchor: "middle", color: P.yellow });
      C.erase(end("h1") + 0.02, 1.0);                                                         // wipes the page; the next write() goes on a fresh page
      C.write("1+2+3 = 6", 800, 260, 170, at("b1") + 0.2, 1.4, { anchor: "middle" });
      const six = C.measure("6", 170);
      C.circle(800 + C.measure("1+2+3 = 6", 170) / 2 - six / 2, 345, 100, 110, atW("b1", "หก"), 0.6, { color: P.pink });
      C.sparkle(1330, 300, atW("b1", "หก") + 0.5, 44);

      M.subtitles();
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
