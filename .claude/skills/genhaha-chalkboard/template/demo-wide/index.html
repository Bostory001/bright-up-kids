<!doctype html>
<!-- Demo "บวก 1 ถึง 100 ใน 5 วินาที" — Chalkboard 16:9 (1920x1080, wide classroom board): digits written stroke by stroke in chalk, a chalk-drawn teacher at the right edge lip-syncs the narration.
     data-start / data-duration are rewritten by `voice` (one <section data-shot="id"> per shot in captions.js). -->
<html lang="{{LANG}}" data-resolution="landscape" class="wide">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>{{TITLE}}</title>
    <script src="gsap.min.js"></script>
    <script src="timing.js"></script>
    <script src="captions.js"></script>
    <script src="motion.js"></script>
    <script src="stick2d-kit.js"></script>
    <script src="chalk-kit.js"></script>
    <link rel="stylesheet" href="look.css" />
    <link rel="stylesheet" href="chalk.css" />
  </head>
  <body class="theme-chalk">
    <div id="root" data-composition-id="main" data-start="0" data-duration="30" data-width="1920" data-height="1080">
      <div id="stage" class="clip" data-start="0" data-duration="30" data-track-index="0"></div>
      <section id="sc-hook" class="clip" data-shot="hook" data-start="0" data-duration="4.5" data-track-index="1"></section>
      <section id="sc-timer" class="clip" data-shot="timer" data-start="4.5" data-duration="4" data-track-index="2"></section>
      <section id="sc-pair" class="clip" data-shot="pair" data-start="8.5" data-duration="5" data-track-index="3"></section>
      <section id="sc-sum" class="clip" data-shot="sum" data-start="13.5" data-duration="4.5" data-track-index="4"></section>
      <section id="sc-count" class="clip" data-shot="count" data-start="18" data-duration="4.5" data-track-index="6"></section>
      <section id="sc-final" class="clip" data-shot="final" data-start="22.5" data-duration="7.5" data-track-index="7"></section>
      <audio id="vo" src="assets/voice/voiceover.wav" data-start="0" data-duration="30" data-track-index="8" data-volume="1"></audio>
      <div id="captions" class="clip" data-start="0" data-duration="30" data-track-index="5"></div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      const M = Motion(tl);
      const C = Chalk(tl, M);
      const { at, end, atW, TOTAL } = M, P = C.P;

      // ---- 16:9 board (1920x1080): writing area x 70–1850, y 70–800; subtitles y 840–990; the teacher stands at the right (x 1740, feet y 800): keep board text out of x > 1590 below y 330 ----
      const T = C.teacher({ x: 1740, y: 800, s: 0.62 });
      C.ground(1600, 1880, 806);
      T.stick(); T.enter(0.12); T.sway(0.5, TOTAL, 1.6, 1.4);
      const talk = { gestures: ["talk2", "idle", "talk3", "idle"], end: "idle" };
      T.say("h1", talk); T.say("t1", talk); T.say("p1", talk); T.say("p2", talk);
      T.say("s1", talk); T.say("s2", talk); T.say("c1", talk); T.say("f1", talk); T.say("f2", talk);
      T.face(at("h1"), "think"); T.face(at("t1"), "smug"); T.face(at("p1"), "happy"); T.face(at("p2"), "grin");
      T.face(at("s1"), "grin"); T.face(at("c1"), "surprised"); T.hop(at("c1") + 0.5, 28);
      T.face(atW("f1", "ได้"), "shock"); T.face(end("f1") - 0.1, "grin"); T.face(at("f2"), "smug");
      T.pose("fist", atW("f1", "ห้าพัน"), 0.3); T.pose("idle", end("f1") + 0.15, 0.4); T.hop(atW("f1", "ห้าพัน") + 0.3, 34);

      // ---- hook: the problem (stays on the board while the timer is drawn under it) ----
      const h = at("h1");
      C.write("1+2+3+…+100", 800, 100, 150, h + 0.3, 1.8, { anchor: "middle" });
      C.write("= ?", 800, 280, 150, h + 2.25, 0.6, { color: P.yellow, anchor: "middle" });

      // ---- timer: five seconds ----
      const tt = at("t1");
      C.circle(330, 650, 130, 130, tt + 0.1, 0.8, { color: P.yellow, w: 9 });
      C.line(330, 520, 330, 490, tt + 0.7, 0.15, { color: P.yellow, w: 9 }); C.line(298, 486, 362, 486, tt + 0.8, 0.15, { color: P.yellow, w: 9 });
      [[330, 540, 330, 560], [330, 740, 330, 760], [200, 650, 220, 650], [440, 650, 460, 650]].forEach((l, i) => C.line(l[0], l[1], l[2], l[3], tt + 0.85 + i * 0.05, 0.1, { color: P.white, w: 7 }));
      C.line(330, 650, 398, 598, tt + 1.2, 0.3, { color: P.pink, w: 10 });
      const five = C.write("5", 620, 540, 200, atW("t1", "ห้า"), 0.5, { color: P.yellow });
      C.write("วินาที", five.x1 + 36, 565, 160, atW("t1", "ห้า") + 0.45, 0.9, { color: P.yellow });
      C.underline(620, 768, 560, atW("t1", "ก็เสร็จ"), 0.5, { color: P.pink });
      C.erase(end("t1") + 0.02, 1.0);

      // ---- pair: first and last ----
      const COL = [250, 520, 790, 1060, 1330], TOP = 100, BOT = 300, SZ = 90;
      const topN = ["1", "2", "3", "…", "50"], bot = ["100", "99", "98", "…", "51"];
      const t0 = at("p1") + 0.25;
      topN.forEach((s, i) => C.write(s, COL[i], TOP, SZ, t0 + 0.12 + i * 0.28, 0.3, { anchor: "middle", color: P.white }));
      bot.forEach((s, i) => C.write(s, COL[i], BOT, SZ, t0 + 1.5 + i * 0.3, 0.3, { anchor: "middle", color: P.blue }));
      const pairUp = (i, t) => {
        C.write("+", COL[i], 205, 70, t, 0.2, { anchor: "middle", color: P.pink, noDust: true });
        C.arc(COL[i] + 120, 200, COL[i] + 120, 295, 34, t + 0.1, 0.4, { color: P.pink, w: 7 });
      };
      const sumOf = (i, t) => C.write("101", COL[i], 470, 80, t, 0.45, { anchor: "middle", color: P.yellow });
      C.arrow(COL[0], 60, COL[0], 96, at("p1") + 0.9, 0.2, { color: P.pink, w: 7, head: 16 });   // little pointer onto the first number
      pairUp(0, atW("p2", "หนึ่งบวก")); sumOf(0, atW("p2", "ได้"));

      // ---- sum: every pair is 101 ----
      pairUp(1, atW("s1", "สองบวก")); sumOf(1, atW("s1", "ก็หนึ่งร้อย"));
      pairUp(2, atW("s2", "สามบวก")); sumOf(2, atW("s2", "ร้อยเอ็ดอีก"));
      pairUp(4, end("s2") - 0.5); sumOf(4, end("s2") - 0.1);
      C.write("…", COL[3], 470, 80, end("s2") + 0.1, 0.3, { anchor: "middle", color: P.yellow });

      // ---- count: fifty pairs ----
      C.brace(150, 1480, 585, 56, atW("c1", "และ"), 0.7, { color: P.pink, w: 9 });
      const fifty = C.write("50", 640, 665, 100, atW("c1", "ห้าสิบ"), 0.5, { color: P.yellow });
      C.write("คู่", fifty.x1 + 24, 668, 100, atW("c1", "ห้าสิบ") + 0.55, 0.4, { color: P.yellow });
      C.erase(end("c1") + 0.05, 0.9);

      // ---- final: 101 × 50 = 5050 ----
      const f = at("f1");
      C.write("101 × 50", 800, 90, 120, f + 0.45, 1.1, { anchor: "middle", color: P.white });
      const big = atW("f1", "ห้าพัน");
      const W = C.measure("5050", 280), x0 = 800 - W / 2;
      C.write("5050", 800, 255, 280, big, 1.0, { anchor: "middle", color: P.yellow, w: 24 });
      C.box(x0 - 50, 228, W + 100, 350, big + 1.05, 0.7, { color: P.pink, w: 10 });
      [[x0 - 50, 228], [x0 + W + 50, 228], [x0 - 50, 578], [x0 + W + 50, 578], [x0 + W + 95, 400]].forEach((p, i) => C.sparkle(p[0], p[1], big + 1.5 + i * 0.1, 38 + (i % 2) * 16, i % 2 ? P.white : P.yellow));
      C.dust(800, 410, big + 1.1, 20, 430, { dur: 0.9 });
      C.write("เกาส์", 800, 640, 90, atW("f2", "เกาส์"), 0.8, { anchor: "middle", color: P.blue });
      C.underline(724, 760, 152, atW("f2", "ประถม"), 0.4, { color: P.blue });

      window.SUB_GLUE = ["ไม่ต้อง", "เครื่องคิดเลข", "หนึ่งร้อยเอ็ด", "หนึ่งร้อย", "เก้าสิบเก้า", "เก้าสิบแปด", "ห้าวินาที", "ทั้งหมด", "แบบนี้", "ตัวหน้า", "ตัวหลัง", "ห้าสิบ", "ห้าพันห้าสิบ"];   // words the subtitle must never break across rows
      M.subtitles();
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
