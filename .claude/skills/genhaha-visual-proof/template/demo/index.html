<!doctype html>
<!-- visual-proof project. Data lives in captions.js (spoken lines + shot ids) + scene.js (VP_SCENE: palette, inks, shots).
     One <section data-shot> per shot (`visual-proof sync` writes them from captions.js, `visual-proof voice` retimes them to the voice).
     Everything is painted on ONE canvas by vp-kit.js as a pure function of time. Nothing else to edit here. -->
<html lang="th" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>{{TITLE}}</title>
    <script>
      // HyperFrames ready signal: frame 0 waits until the fonts are loaded and the first frame is painted
      window.__hf = window.__hf || {}; window.__hf.buildReady = window.__hf.buildReady || {};
      window.__hf.buildReady.vp = new Promise((res) => { window.__vpReady = res; });
    </script>
    <link rel="stylesheet" href="vp.css" />
    <script src="vendor/gsap.min.js"></script>
    <script src="timing.js"></script>
    <script src="captions.js"></script>
    <script src="vp-lib.js"></script>
    <script src="vp-art.js"></script>
    <script src="vp-validate.js"></script>
    <script src="scene.js"></script>
    <script src="vp-kit.js"></script>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="28" data-width="1080" data-height="1920">
      <div id="stage" class="clip" data-start="0" data-duration="28" data-track-index="0"></div>
      <!-- vp:sections -->
      <section id="sc-s1" class="clip" data-shot="s1" data-start="0" data-duration="4" data-track-index="1"></section>
      <!-- /vp:sections -->
      <audio id="vo" src="assets/voice/voiceover.wav" data-start="0" data-duration="28" data-track-index="30" data-volume="1"></audio>
      <div id="captions" class="clip" data-start="0" data-duration="28" data-track-index="31"></div>
      <div id="chrome" class="clip" data-start="0" data-duration="28" data-track-index="32"></div>
      <div class="fontwarm"><span style="font: 500 20px Newsreader">ab12</span><span style="font: italic 500 20px Newsreader">abn</span><span style="font: 600 20px 'IBM Plex Sans Thai'">กขค</span><span style="font: 500 20px 'IBM Plex Sans Thai'">กขค</span></div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      const built = VPK.boot(tl, window.VP_SCENE);
      tl.seek(0);
      Promise.resolve(built && built.ready).finally(() => window.__vpReady && window.__vpReady());
    </script>
  </body>
</html>
